indexpage:
  title: Documentação do ONTAP Select
  lead: NetApp ONTAP Select é um dispositivo de storage definido por software que
    você pode implantar em uma variedade de servidores de hardware como commodity
    executando o hipervisor VMware ESXi ou Kernel-based Virtual Machine (KVM). Ele
    oferece a agilidade necessária para construir uma infraestrutura de nuvem privada
    flexível e escalável. Este site contém a documentação do ONTAP Select 9.19.1.
